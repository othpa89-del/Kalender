<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16233F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kalender" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512-v2.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v2.png" />
    <link rel="icon" href="favicon-v2.ico" />
    <title>Kalender – Familie & Business</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { overflow-x: hidden; background: #0B1426; -webkit-text-size-adjust: 100%; }
      #root { min-height: 100vh; }
      * { box-sizing: border-box; }
      /* Eingabefelder dürfen ihren Container nie sprengen (v. a. iOS date/time) */
      input, select, textarea { max-width: 100%; min-width: 0; }
      /* iOS/iPadOS: Datum- und Uhrzeitfelder haben eine grosse Eigenbreite und
         lassen sich sonst nicht schmal genug rechnen -> sie ueberlappen. */
      input[type="date"], input[type="time"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        min-height: 42px;
        text-align: left;
      }
      /* Datum/Uhrzeit-Paare: am Handy untereinander, ab Tablet nebeneinander.
         So koennen sie sich auf schmalen Geraeten gar nicht erst ueberlappen. */
      .dt-row { display: flex; gap: 10px; flex-wrap: wrap; }
      .dt-col { flex: 1 1 100%; min-width: 0; }
      @media (min-width: 560px) {
        .dt-col { flex: 1 1 46%; }
      }
      /* Nur Desktop: kein 0.9-Zoom (das macht am großen Bildschirm unscharf und
         lässt die Schrift zu fett wirken) + sauberes Antialiasing. Handy/iPad
         behalten die kompakte 0.9-Darstellung. */
      @media (min-width: 1024px) and (pointer: fine) {
        .app-root {
          zoom: 1 !important;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }
      }
      /* Tastatur-Bedienung: sichtbarer Fokus (Eingabefelder setzen outline:none) */
      :focus-visible {
        outline: 2px solid #2E5BFF;
        outline-offset: 2px;
        border-radius: 6px;
      }
      /* Rueckmeldung beim Tippen/Ueberfahren. opacity wirkt auch auf transparente
         Buttons und ueberschreibt kein Inline-transform (z. B. zentrierter FAB). */
      button { transition: opacity .12s ease; }
      @media (hover: hover) { button:hover:not(:disabled) { opacity: .82; } }
      button:active:not(:disabled) { opacity: .6; }
      /* Sehr schmale Handys: Beschriftung weglassen, damit die Kopfzeilen-Buttons
         nicht zusammengequetscht werden. */
      @media (max-width: 400px) { .hdr-label { display: none; } }
      /* Monatsansicht auch am Handy gut treffbar (Balken/Tageszahlen groesser) */
      .cal-bars { grid-auto-rows: 22px !important; row-gap: 3px !important; }
      .cal-bar { line-height: 22px !important; font-size: 11px !important; border-radius: 5px !important; padding: 0 6px !important; }
      .cal-daynum { width: 26px !important; height: 26px !important; line-height: 26px !important; font-size: 13px !important; }
      .cal-more { font-size: 11px !important; line-height: 20px !important; min-height: 22px; }
      /* Sehr schmale Handys: Innenabstand zurueckziehen, sonst bleibt im Balken
         nur noch das Emoji plus "…" uebrig. */
      @media (max-width: 400px) { .cal-bar { padding: 0 3px !important; } }
      /* Desktop/Tablet: Monatsansicht großzügiger, damit sie wie ein echter
         Kalender wirkt (am Handy bleibt die kompakte Darstellung). */
      @media (min-width: 760px) {
        .cal-week { min-height: 116px; }
        .cal-bars { grid-auto-rows: 23px !important; row-gap: 4px !important; padding-top: 5px !important; }
        .cal-bar { line-height: 23px !important; font-size: 12.5px !important; border-radius: 6px !important; padding: 0 8px !important; }
        .cal-daynum { width: 26px !important; height: 26px !important; line-height: 26px !important; font-size: 14px !important; }
      }
      /* Copyright beim Drucken / als PDF immer am Seitenende anzeigen */
      @media print {
        .app-copyright { display: block !important; }
        @page { margin-bottom: 16mm; }
        body::after {
          content: "© Copyright by Patrick Thorn";
          position: fixed; bottom: 6mm; left: 0; right: 0;
          text-align: center; font-size: 9pt; color: #555;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
